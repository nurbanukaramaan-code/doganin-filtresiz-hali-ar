<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğanın Filtresiz Hali – AR</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #1e140d;
  font-family: 'Poppins', sans-serif;
}

video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}

/* Rehber çerçeve */
#frame {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 65vw;
  height: 65vw;
  max-width: 320px;
  max-height: 320px;
  border: 2px dashed rgba(255,246,222,0.6);
  transform: translate(-50%, -50%);
  border-radius: 24px;
}

/* Efektler */
.effect {
  position: absolute;
  width: 80px;
  animation: float 3s ease-in-out infinite;
}

#eyeL { top: 42%; left: 43%; }
#eyeR { top: 42%; left: 57%; }
#mouth { top: 60%; left: 50%; width: 120px; }

@keyframes float {
  0% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.03) rotate(1deg); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

/* Alt metin */
#caption {
  position: absolute;
  bottom: 6%;
  width: 100%;
  text-align: center;
  color: #fff6de;
  font-size: 16px;
  padding: 0 20px;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<div id="frame"></div>

<!-- ŞİMDİLİK RENKLİ DAİRELER = EFEKT YERİ -->
<div class="effect" id="eyeL" style="background:#ecb3ba;border-radius:50%;height:40px;"></div>
<div class="effect" id="eyeR" style="background:#ecb3ba;border-radius:50%;height:40px;"></div>
<div class="effect" id="mouth" style="background:#c41925;border-radius:40px;height:30px;"></div>

<div id="caption">
Bugün biraz yamuk uyandım<br>ama vitamin yerinde.
</div>

<script>
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
.then(stream => {
  document.getElementById('camera').srcObject = stream;
})
.catch(err => alert("Kamera erişimi reddedildi"));
</script>

</body>
</html>
